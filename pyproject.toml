[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vci-bayes"
version = "0.1.0"
description = "Shared helpers for VCI Bayesian-network projects (HBC and METAVCI subprojects)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Malin Overmars, PhD" }]
dependencies = [
    "numpy",
    "pandas>=2",
    "pyyaml",
    "pyreadstat",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "pyagrum",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 100
target-version = "py311"
