[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vcibayes"
version = "1.2.1"
description = "Layered Bayesian networks for cohort studies: spec-driven structure learning, bootstrap edge stability, and sensitivity analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Malin Overmars, PhD" }]
keywords = ["bayesian-network", "pyagrum", "epidemiology", "cohort-study"]

# pyreadstat is deliberately NOT here: SPSS reading is cohort preprocessing,
# which lives in the analysis repo, not in the method.
dependencies = [
    "numpy",
    "pandas>=2",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "pyagrum",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# Needed only to run the template notebook; the package itself does not
# import Jupyter.
notebook = ["jupyterlab", "pyarrow"]

[project.scripts]
vcibayes = "vcibayes.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["vcibayes"]
# The spec and notebook templates are shipped inside the package so that
# `vcibayes init` works from an installed wheel, not only from a checkout.
artifacts = ["vcibayes/templates/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
