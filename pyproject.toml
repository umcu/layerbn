[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "layerbn"
dynamic = ["version"]
description = "Layered Bayesian networks for cohort studies: ordered layers, arc stability by bootstrap, and a report from two input files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Malin Overmars, PhD" }]
keywords = [
    "bayesian-network",
    "structure-learning",
    "causal-discovery",
    "pyagrum",
    "epidemiology",
    "cohort-study",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

# pyreadstat is not a dependency. Install it to read SPSS (.sav) data files.
dependencies = [
    "numpy>=1.24",
    "pandas>=2",
    "pyyaml>=6",
    # Reads the variables workbook (variables.xlsx) and writes tables.xlsx.
    "openpyxl>=3.1",
    # Upper bound is deliberate. scikit-learn 1.9 changes the default
    # `quantile_method` of KBinsDiscretizer, which pyAgrum uses for
    # quantile binning -- so the bin edges, and therefore every number
    # this package reports, would move on upgrade. tests/test_reproducibility.py
    # pins the current edges; lift this bound only together with that file.
    "scikit-learn>=1.3,<1.9",
    "scipy>=1.10",
    "matplotlib>=3.7",
    # 2.0 renamed the import from `pyAgrum` to `pyagrum` and moved the
    # learner API this package calls; 1.x will not run. The upper bound is
    # deliberate, like the one for scikit-learn: quantile bin edges differ
    # between pyAgrum 2.1 and 2.3, so every result moves with the version.
    # tests/test_reproducibility.py records the edges per series. Lift the
    # bound only together with that file.
    "pyagrum>=2.1,<2.4",
]

[project.urls]
Homepage = "https://github.com/umcu/layerbn"
Repository = "https://github.com/umcu/layerbn"
Issues = "https://github.com/umcu/layerbn/issues"
Documentation = "https://umcu.github.io/layerbn/"
Changelog = "https://github.com/umcu/layerbn/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "nbclient>=0.10", "nbformat>=5"]
# For the optional notebook (layerbn init --notebook) and for Parquet data
# files. The package itself does not import Jupyter.
notebook = ["jupyterlab", "pyarrow"]
# To build the documentation site: mkdocs serve (or mkdocs build --strict).
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.scripts]
layerbn = "layerbn.__main__:main"

[tool.hatch.version]
# Single-sourced: the package is the only place the version is written.
path = "layerbn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["layerbn"]
# The spec and notebook templates are shipped inside the package so that
# `layerbn init` works from an installed wheel, not only from a checkout.
artifacts = ["layerbn/templates/*"]

[tool.hatch.build.targets.sdist]
include = ["layerbn", "tests", "docs", "mkdocs.yml", "README.md", "LICENSE", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The report is mostly CSS and HTML in strings, which reads better unwrapped.
"layerbn/report.py" = ["E501"]
# The explorer page is likewise one HTML/CSS/JS template in a string.
"layerbn/explorer.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: end-to-end runs that fit many networks",
]
