# HBC — Bayesian network analysis specification.
# ─────────────────────────────────────────────────────────────────────────
# WHAT the analysis is. Machine-specific paths stay in config.yml, so this
# file is shareable as-is. The spec starts at the analysis-ready dataframe;
# preprocessing is not expressible here and is not meant to be.
#
# These values reproduce the published HBC analysis exactly. They were
# transcribed from 01_bayesian_network.ipynb; see SPEC_PLAN.md for the
# cell-by-cell provenance of every value below.
#
# Loaded by core.spec.load_spec().

spec_version: 1
name: hbc
description: >
  Heart-Brain Connection: layered Bayesian network for 4-year CDR increase
  and MACE, with dropout modelled explicitly as a downstream selection layer.

data:
  # Resolved against config.output_dir by the notebook.
  path: df_imp.parquet

# ─── Layers ──────────────────────────────────────────────────────────────
# ORDER IS THE CONSTRAINT: the learner only allows arcs from a layer to
# itself or to a layer further down this list. Previously this order came
# out of `bn_vars.groupby('LAYER')`, i.e. it was alphabetical and correct
# only by accident of the L0..L9 prefixes. Here it is explicit.
#
# A variable must appear in exactly one layer; the loader enforces that.
# `role` marks the outcome and dropout layers. It replaces matching on the
# substrings "Outcomes"/"Dropout" in the layer name.
#
# Membership is unchanged from bn_vars.parquet. Note there is no L1 and no
# L3 layer in this cohort — the numbering has gaps by design.

layers:
  - name: "L0 – Unmodifiable demographics"
    role: covariate
    variables:
      - AGE
      - SEX

  - name: "L2 – Cardiovascular risk factors"
    role: covariate
    variables:
      - VASCULAR RISK SCORE

  - name: "L4 – Potential disease process markers"
    role: covariate
    variables:
      - BIOMARKER SCORE 1
      - BIOMARKER SCORE 2
      - CEREBRAL BLOOD FLOW
      - PTAU181
      - NFL
      - GFAP
      - AB40
      - AB42

  - name: "L5 - Imaging markers of neurovascular damage"
    role: covariate
    variables:
      - SMALL VESSEL DISEASE SCORE
      - HIPPOCAMPUS/INTRACRANIAL VOLUME
      - BRAIN/INTRACRANIAL VOLUME

  - name: "L6 – Current and previous cardiovascular diagnoses / Vascular interventions"
    role: covariate
    variables:
      - STROKE HISTORY
      - PATIENT GROUP
      - ATHEROSCLEROTIC CARDIOVASCULAR DISEASE HISTORY

  - name: "L7 - Functional status"
    role: covariate
    variables:
      - MINI MENTAL STATE EXAMINATION
      - STARKSTEIN SCORE
      - BASELINE CDR

  - name: "L8 – Outcomes"
    role: outcome
    variables:
      - OUTCOME_CDR_INCREASE
      - OUTCOME_MACE

  - name: "L9 – Dropout"
    role: selection
    variables:
      - DROPOUT REASON

# ─── Discretisation ──────────────────────────────────────────────────────
# Applied to numeric columns with more than `threshold` distinct values.
# This one setting determines every bin edge in the analysis.

discretisation:
  method: quantile
  n_bins: 4
  threshold: 10

# ─── Structure learning ──────────────────────────────────────────────────

model:
  score: K2
  use_tabu: true
  max_indegree: 5
  seed: 42

bootstrap:
  n: 200

# ─── Network variants ────────────────────────────────────────────────────
# One entry per network learned. `exclude_layers` drops a layer from
# structure learning entirely; `outcomes` are the outcome/selection
# variables that network is learned with (any other variable from an
# outcome or dropout layer is dropped before learning).

variants:
  - name: cdr
    outcomes: [OUTCOME_CDR_INCREASE, DROPOUT REASON]
    exclude_layers: ["L4 – Potential disease process markers"]

  - name: mace
    outcomes: [OUTCOME_MACE, DROPOUT REASON]
    exclude_layers: ["L4 – Potential disease process markers"]

  - name: joint
    outcomes: [OUTCOME_CDR_INCREASE, OUTCOME_MACE, DROPOUT REASON]
    exclude_layers: ["L4 – Potential disease process markers"]

  # Biomarker ablation: same outcomes, but L4 participates.
  - name: with_biomarkers
    outcomes: [OUTCOME_CDR_INCREASE, OUTCOME_MACE, DROPOUT REASON]
    exclude_layers: []
    bootstrap_n: 10

# ─── Analyses ────────────────────────────────────────────────────────────

analyses:
  # Which outcomes to rank variables for by mutual information.
  information:
    targets:
      - OUTCOME_CDR_INCREASE
      - OUTCOME_MACE

  # Posterior outcome risk for fixed patient profiles, with bootstrap CIs.
  # Values are given as they appear in the notebook: strings are matched
  # against a state label first, numbers are snapped to the bin containing
  # them. AGE is a string here and an integer in knob_sweep.base_profile,
  # exactly as in the published run.
  scenarios:
    bootstrap_n: 200
    profiles:
      "Healthy profile":
        PATIENT GROUP: Reference
        SMALL VESSEL DISEASE SCORE: "0"
        AGE: "58"
        MINI MENTAL STATE EXAMINATION: "29"
        BASELINE CDR: "0"
        SEX: Male
      "Ill profile":
        PATIENT GROUP: Vascular cognitive impairment
        SMALL VESSEL DISEASE SCORE: "2"
        AGE: "76"
        BASELINE CDR: "0"
        SEX: Female
    targets:
      - {variable: OUTCOME_CDR_INCREASE, label: CDR increase}
      - {variable: OUTCOME_MACE, label: MACE event}

  # Fix a patient, sweep one variable across all its states.
  # base_profile must hold only variables UPSTREAM of the knob: fixing a
  # mediator blocks the pathway the knob acts through. The sweep warns if
  # you do.
  knob_sweep:
    knob: SMALL VESSEL DISEASE SCORE
    base_profile:
      SEX: Female
      AGE: 72
    outcomes:
      - OUTCOME_CDR_INCREASE
      - OUTCOME_MACE
    bootstrap_n: 200
