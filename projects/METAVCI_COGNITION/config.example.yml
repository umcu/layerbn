# METAVCI_COGNITION — project configuration.
# ─────────────────────────────────────────────────────────────────────────
# Loaded by core.config.load_project_config().
# Keep secret / machine-specific paths in here; do NOT commit them
# unedited if they contain confidential file locations.

# Absolute path to this project folder. Everything else is resolved
# relative to this if not itself absolute.
project_root: '/absolute/path/to/projects/METAVCI_COGNITION'

# Where your raw METAVCI cohort files live (SPSS .sav, CSV, ...).
raw_dir: '/absolute/path/to/METAVCI/raw'

# Where processed parquet files will be written.
output_dir: '/absolute/path/to/METAVCI/processed'

# Codebook: one row per variable with a LAYER column.
codebook_path: '/absolute/path/to/projects/METAVCI_COGNITION/codebook/Cognition_BN_rules_to_fill_in.xltx'

# SCORE2 region — only used if the preprocess pipeline computes SCORE2.
risk_region: 'Low'

# Random seed for reproducibility.
seed: 1234

# ─── Cohort-specific settings ────────────────────────────────────────────
# Add extra keys here; they land in PreprocessConfig.extra as a plain
# dict, available from notebooks via `config.extra["key"]`.
#
# Examples for a cognitive-outcome pipeline:
# follow_up_years: 3
# cognitive_battery: [MMSE, MoCA, TMT_A, TMT_B]
# outcome_variables: [OUTCOME_COGNITIVE_DECLINE, OUTCOME_DEMENTIA]
