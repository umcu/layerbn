# Project configuration.
# ─────────────────────────────────────────────────────────────────────────
# This file is loaded by core.config.load_project_config().
# Keep secret / machine-specific paths in here; do NOT commit them
# unedited if they contain confidential file locations.

# Absolute path to this project folder. Everything else is resolved
# relative to this if not itself absolute.
project_root: '/absolute/path/to/projects/MY_NEW_PROJECT'

# Where your raw data files live (SPSS .sav, CSV, Excel, ...).
# Typically outside this repo, next to the source data.
raw_dir: '/absolute/path/to/raw/data'

# Where processed parquet files will be written.
# The three artefacts df.parquet, df_imp.parquet, bn_vars.parquet land here.
output_dir: '/absolute/path/to/processed/data'

# Optional: Excel codebook that maps VARIABLE NAME -> LAYER for the
# Bayesian network structure. If absent, define the mapping directly
# in 00_preprocess.ipynb.
codebook_path: '/absolute/path/to/CODEBOOK.xlsx'

# Cardiovascular risk model region (SCORE2 2021 calibration groups).
# Only used if your preprocess pipeline calls core.risk_scores.score2().
# One of: Low, Moderate, High, Very high
risk_region: 'Low'

# Random seed for reproducibility (imputation, bootstrap, structure learning).
seed: 1234

# ─── Cohort-specific settings ────────────────────────────────────────────
# Add any extra keys your project needs. They land in
# PreprocessConfig.extra as a plain dict, so notebooks can read them.
#
# Examples:
# follow_up_years: 5
# minimum_age: 40
# outcome_variables: [OUTCOME_DEMENTIA, OUTCOME_STROKE]
